name: superstore-hive

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: superstore-namenode
    environment:
      CLUSTER_NAME: superstore
    env_file: ./hadoop-hive.env
    ports:
      - "50070:50070"
    volumes:
      - namenode:/hadoop/dfs/name
      - ./data:/data:ro

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: superstore-datanode
    env_file: ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: namenode:50070
    volumes:
      - datanode:/hadoop/dfs/data

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: superstore-postgresql
    volumes:
      - metastore:/var/lib/postgresql/data

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: superstore-metastore
    env_file: ./hadoop-hive.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: namenode:50070 datanode:50075 hive-metastore-postgresql:5432

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: superstore-hive-server
    env_file: ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: hive-metastore:9083
    ports:
      - "10000:10000"
    volumes:
      - ./data:/data:ro

volumes:
  namenode:
  datanode:
  metastore: